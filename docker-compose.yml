services:
  pigeon:
    build:
      context: .
      args:
        # stamped into the image, shown on /, /health and the start log
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: pigeon
    restart: unless-stopped
    # bubblewrap sandbox: Docker's default seccomp profile blocks the
    # unshare syscall, the container lacks CAP_SYS_ADMIN for
    # CLONE_NEWNS, and the AppArmor docker-default profile refuses the
    # mount-propagation change bwrap needs — without all three, the
    # sandbox cannot start (pigeon then fails the run, no fallback)
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      - SYS_ADMIN
    ports:
      - "8080:8080"
    environment:
      # Nextcloud
      NEXTCLOUD_URL: ${NEXTCLOUD_URL}
      # secret from `occ talk:bot:install <name> <secret> <url> ...`
      TALK_BOT_SECRET: ${TALK_BOT_SECRET}
      # behaviour
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PI_TIMEOUT: ${PI_TIMEOUT:-600}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-30}
      STATE_SCAN_EVERY: ${STATE_SCAN_EVERY:-10}
      SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-30}
      MAX_RETRIES: ${MAX_RETRIES:-1}
      PORT: "8080"
    volumes:
      # one folder per bot, one sub-folder per Talk room (pi working dirs)
      - ./bots:/bots
      # pi default config files (auth.json, models.json, sessions, ...)
      # and skills (bundled skills are copied here at startup, see README)
      - pi-home:/pi-home
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pi-home:
